<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blueprint Hub</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1c1c1a;--muted:#6b6b66;--line:#e4e4df;--accent:#2f6fde;
  --pending:#b7791f;--revise:#c2410c;--approved:#15803d;--blocked:#b91c1c;--chip:#efefea}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--panel:#1d1d1b;--ink:#ecece8;--muted:#a3a39c;
  --line:#33332f;--accent:#7aa7ff;--pending:#e0a43a;--revise:#fb923c;--approved:#4ade80;--blocked:#f87171;--chip:#2a2a27}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0;flex:1;min-width:200px}
header .phase{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--chip)}
nav{display:flex;gap:4px;padding:8px 16px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:0;color:var(--muted);font:600 13px system-ui;padding:6px 12px;border-radius:8px;cursor:pointer}
nav button.on{background:var(--chip);color:var(--ink)}
nav .badge{display:inline-block;min-width:18px;margin-left:4px;padding:0 5px;border-radius:99px;background:var(--pending);color:#fff;font-size:11px}
main{padding:16px;max-width:1200px;margin:0 auto}
section{display:none}section.on{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
a{color:var(--accent)}
.card h3{margin:0 0 4px;font-size:14px}.card a{color:inherit;text-decoration:none}
a.card{display:block;color:inherit;text-decoration:none;border-left:3px solid var(--line);transition:border-color .15s,transform .15s,box-shadow .15s}
a.card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.18)}
a.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a.card.c-pending{border-left-color:var(--pending)}a.card.c-revise{border-left-color:var(--revise)}a.card.c-approved{border-left-color:var(--approved)}
a.card.c-approved{opacity:.75}a.card.c-approved:hover{opacity:1}
.muted{color:var(--muted);font-size:12px}
.state{font:700 11px system-ui;text-transform:uppercase;letter-spacing:.04em}
.s-pending{color:var(--pending)}.s-revise{color:var(--revise)}.s-approved,.s-done{color:var(--approved)}.s-blocked{color:var(--blocked)}
.stat{font-size:26px;font-weight:700}
.loops{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.loop{padding:6px 12px;border-radius:99px;background:var(--chip);font-size:12px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--chip);border-radius:12px;padding:8px;min-height:120px}
.col h4{margin:2px 4px 8px;font-size:12px;text-transform:uppercase;color:var(--muted)}
.tk{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;font-size:13px}
.tk .id{font:600 11px ui-monospace,Menlo,monospace;color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:6px;background:var(--chip);margin-right:4px}
.timeline{list-style:none;padding:0;margin:0}
.timeline li{padding:8px 0;border-bottom:1px solid var(--line)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:7px 14px;font:600 13px system-ui;cursor:pointer}
.btn[disabled]{opacity:.4;cursor:default}
.graph{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:16px;overflow-x:auto}
.empty{color:var(--muted);padding:24px 0}
</style>
</head>
<body>
<header>
  <h1 id="title">Loading…</h1>
  <span class="phase" id="phase"></span>
  <button class="btn" id="next" type="button">Review next pending</button>
</header>
<nav id="tabs">
  <button data-tab="overview" class="on">Overview</button>
  <button data-tab="reviews">Reviews <span class="badge" id="pending-badge" hidden></span></button>
  <button data-tab="board">Board</button>
  <button data-tab="timeline">Timeline</button>
</nav>
<main>
  <section id="overview" class="on"></section>
  <section id="reviews"></section>
  <section id="board"></section>
  <section id="timeline"></section>
</main>
<script src="/_review/vendor/mermaid.min.js" onerror="window.mermaid=null"></script>
<script>
(function () {
  var COLS = ['backlog', 'ready', 'in_progress', 'in_review', 'blocked', 'done', 'dropped'];
  var state = { reviews: {}, status: {} };
  var lastGraph = '', lastBoard = '';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };

  function pending() {
    return Object.keys(state.reviews).filter(function (k) { return state.reviews[k].state === 'pending'; }).sort();
  }

  function overview() {
    var s = state.status, c = s.counts || {}, loops = s.loops || {};
    var total = (s.tickets || []).length, done = c.done || 0;
    var html = '<div class="grid">' +
      stat('Tickets done', done + ' / ' + total) + stat('In review (PRs)', c.in_review || 0) +
      stat('Blocked', c.blocked || 0) + stat('Designs waiting on you', pending().length) + '</div>';
    html += '<h3>Loops</h3><div class="loops">' + (Object.keys(loops).map(function (l) {
      return '<span class="loop">' + esc(l) + ' · <span class="state s-' + esc(loops[l]) + '">' + esc(loops[l]) + '</span></span>';
    }).join('') || '<span class="muted">No loops started yet.</span>') + '</div>';
    if ((s.blockers || []).length) {
      html += '<h3>Blockers</h3>' + s.blockers.map(function (b) { return '<p class="s-blocked">' + esc(b) + '</p>'; }).join('');
    }
    if ((s.prs || []).length) {
      html += '<h3>Pull requests</h3>' + s.prs.map(function (p) {
        return '<p><a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.repo) + '#' + esc(p.number) +
          '</a> <span class="muted">' + esc(p.ticket) + ' · ' + esc(p.state) + '</span></p>';
      }).join('');
    }
    $('overview').innerHTML = html;
  }
  function stat(label, v) { return '<div class="card"><div class="muted">' + label + '</div><div class="stat">' + esc(v) + '</div></div>'; }

  function reviews() {
    var keys = Object.keys(state.reviews).sort(function (a, b) {
      var o = { pending: 0, revise: 1, approved: 2 };
      return (o[state.reviews[a].state] - o[state.reviews[b].state]) || a.localeCompare(b);
    });
    $('reviews').innerHTML = keys.length ? '<div class="grid">' + keys.map(function (k) {
      var r = state.reviews[k];
      var hint = r.state === 'revise' ? 'with ' + r.owner + ', revising' : r.state === 'pending' ? 'waiting on you' : 'approved';
      return '<a class="card c-' + esc(r.state) + '" href="/a/' + esc(r.file.replace(/^artifacts\//, '')) + '"><div class="state s-' + esc(r.state) + '">' +
        esc(r.state) + '</div><h3>' + esc(r.title) + '</h3><div class="muted">' + esc(k) + ' · round ' + esc(r.round) +
        ' · ' + esc(hint) + '</div></a>';
    }).join('') + '</div>' : '<p class="empty">Nothing to review yet. Agents are still working.</p>';
    var n = pending().length;
    $('pending-badge').hidden = !n; $('pending-badge').textContent = n;
    $('next').disabled = !n;
    $('next').textContent = n ? 'Review next pending (' + n + ')' : 'Nothing waiting on you';
  }

  function board() {
    var t = state.status.tickets || [];
    if (!t.length) { $('board').innerHTML = '<p class="empty">No tickets yet. The product manager creates them once the breakdown is approved.</p>'; return; }
    var html = '<div class="board">' + COLS.filter(function (c) {
      return c !== 'dropped' || t.some(function (x) { return x.status === 'dropped'; });
    }).map(function (c) {
      var items = t.filter(function (x) { return x.status === c; });
      return '<div class="col"><h4>' + c.replace('_', ' ') + ' · ' + items.length + '</h4>' + items.map(function (x) {
        return '<div class="tk"><div class="id">' + esc(x.id) + ' · ' + esc(x.estimate || '') + '</div>' + esc(x.title) +
          '<div><span class="tag">' + esc(x.repo || '—') + '</span><span class="tag">' + esc(x.owner_agent || '') + '</span></div>' +
          ((x.depends_on || []).length ? '<div class="muted">after ' + esc(x.depends_on.join(', ')) + '</div>' : '') + '</div>';
      }).join('') + '</div>';
    }).join('') + '</div><div class="graph" id="graph"></div>';
    $('board').innerHTML = html;
    lastGraph = '';
    drawGraph(t);
    lastBoard = JSON.stringify(t);
  }

  function drawGraph(t) {
    if (!window.mermaid) { $('graph').innerHTML = '<span class="muted">Dependency graph needs review/vendor/mermaid.min.js.</span>'; return; }
    var lines = ['graph LR'];
    t.forEach(function (x) {
      var id = x.id.replace(/[^A-Za-z0-9]/g, '');
      lines.push('  ' + id + '["' + x.id + ' ' + String(x.title).replace(/["\[\]]/g, '') + '"]:::' + x.status);
      (x.depends_on || []).forEach(function (d) { lines.push('  ' + d.replace(/[^A-Za-z0-9]/g, '') + ' --> ' + id); });
    });
    lines.push('  classDef done fill:#dcfce7,stroke:#15803d', '  classDef blocked fill:#fee2e2,stroke:#b91c1c',
      '  classDef in_progress fill:#dbeafe,stroke:#2f6fde', '  classDef in_review fill:#fef3c7,stroke:#b7791f');
    var src = lines.join('\n');
    if (src === lastGraph) return;
    lastGraph = src;
    var dark = matchMedia('(prefers-color-scheme: dark)').matches;
    window.mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'neutral' });
    window.mermaid.render('deps', src).then(function (r) { $('graph').innerHTML = '<h3>Dependencies</h3>' + r.svg; });
  }

  function timeline() {
    var j = (state.status.journal || []).slice().reverse();
    $('timeline').innerHTML = j.length ? '<ul class="timeline">' + j.map(function (e) {
      return '<li><div class="muted">' + esc(e.at) + ' · ' + esc(e.kind) + '</div><b>' + esc(e.subject) + '</b> ' + esc(e.text) +
        (e.link ? ' <span class="muted">(' + esc(e.link) + ')</span>' : '') + '</li>';
    }).join('') + '</ul>' : '<p class="empty">The trail starts when the first decision is made.</p>';
  }

  function render() {
    var s = state.status;
    $('title').textContent = (s.req || '') + (s.title ? ' · ' + s.title : '');
    document.title = (s.req || 'Blueprint') + ' · Hub';
    $('phase').textContent = s.phase || 'starting';
    overview(); reviews(); timeline();
    if ($('board').classList.contains('on') && JSON.stringify(s.tickets || []) !== lastBoard) board();
  }

  function refresh() {
    return Promise.all([fetch('/__reviews').then(function (r) { return r.json(); }),
                        fetch('/__status').then(function (r) { return r.json(); })])
      .then(function (res) { state.reviews = res[0].artifacts || {}; state.status = res[1] || {}; render(); })
      .catch(function () { $('phase').textContent = 'server not reachable'; });
  }

  function goNext() {
    var p = pending();
    if (p.length) location.href = '/a/' + state.reviews[p[0]].file.replace(/^artifacts\//, '');
    else show('reviews');
  }

  function show(tab) {
    Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) { b.classList.toggle('on', b.dataset.tab === tab); });
    Array.prototype.forEach.call(document.querySelectorAll('main section'), function (s) { s.classList.toggle('on', s.id === tab); });
    if (tab === 'board') board();
  }

  $('tabs').addEventListener('click', function (e) {
    var t = e.target.closest('button');
    if (t) { show(t.dataset.tab); history.replaceState(null, '', '#' + t.dataset.tab); }
  });
  $('next').addEventListener('click', goNext);
  refresh().then(function () {
    var h = location.hash.slice(1);
    if (h === 'next') { history.replaceState(null, '', '/'); goNext(); }
    else if (['overview', 'reviews', 'board', 'timeline'].indexOf(h) >= 0) show(h);
  });
  setInterval(refresh, 3000);
})();
</script>
</body>
</html>
